# Render Blueprint — Department of Artificial Intelligence website
# Docs: https://render.com/docs/blueprint-spec
#
# This deploys the site as a static site: no build step required, since
# it's plain HTML, CSS and JavaScript served directly from the repo root.
#
# To use it:
#   1. Push this project to a GitHub/GitLab repository.
#   2. In the Render dashboard, click "New +" -> "Blueprint" and connect
#      that repository. Render will detect this file automatically and
#      set everything up for you.
#
# (You can also skip this file and create the service manually via
# "New +" -> "Static Site", using the same buildCommand/publish path
# shown below.)

services:
  - type: web
    runtime: static
    name: department-of-ai-website
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
